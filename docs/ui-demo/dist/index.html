const version=(id,params,desc,cand='C02')=>({id,params:{...params},desc,candidate:cand});
function fresh(){return {roles:[{id:'knight',name:'灰烬重甲兵',file:'AshKnight_Rig_v003.blend',rig:'骨架 v03 · 58 骨骼',cameras:'正面 + 侧面 / 固定双视角',reader:'ready'},{id:'wolf',name:'荒原战狼',file:'WastelandWolf_Rig_v002.blend',rig:'骨架 v02 · 42 骨骼',cameras:'正面 + 侧面 / 固定双视角',reader:'pending'}],tasks:[{id:'slash',role:'knight',name:'斜劈 · 重击',slug:'heavy_slash',kind:'attack',duration:5,status:'review',candidates:[candidate('C01','warn',40218),candidate('C02','good',40219),candidate('C03','fail',40220)],chosen:'C02',versions:[version('v01',{...defaults,smooth:8,foot:false},'初始拟合 · 手部轻微抖动'),version('v02',defaults,'降低抖动 · 开启脚锁定')],current:'v02',accepted:null},{id:'walk',role:'knight',name:'持剑行走',slug:'sword_walk',kind:'walk',duration:5,status:'accepted',candidates:[candidate('C01','good',21103)],chosen:'C01',versions:[version('v01',{...defaults,steps:true},'步幅位移 · 已采用','C01')],current:'v01',accepted:'v01'},{id:'hit',role:'knight',name:'侧向受击',slug:'hit_side',kind:'reaction',duration:4,status:'candidates',candidates:[candidate('C01','warn',72011),candidate('C02','good',72012)],chosen:'C02',versions:[],current:null,accepted:null},{id:'death',role:'knight',name:'后仰倒地',slug:'death_back',kind:'death',duration:5,status:'draft',candidates:[],chosen:null,versions:[],current:null,accepted:null},{id:'roar',role:'wolf',name:'威吓咆哮',slug:'wolf_roar',kind:'roar',duration:4,status:'draft',candidates:[],chosen:null,versions:[],current:null,accepted:null},{id:'run',role:'wolf',name:'冲刺奔跑',slug:'wolf_run',kind:'walk',duration:5,status:'draft',candidates:[],chosen:null,versions:[],current:null,accepted:null}],jobs:[],deliveries:[],page:'studio',selected:'slash',roleFilter:'all',filter:'all',tab:'fit',draft:{...defaults},compare:'v01',selection:[],paused:false,next:1};}
let state;
try{const raw=JSON.parse(localStorage.getItem(KEY));state=raw&&raw.roles&&raw.tasks&&raw.jobs&&raw.deliveries?raw:fresh();}catch{state=fresh();}
state.jobs.forEach(j=>{if(j.status==='running')j.status='queued';});
let frame=36,playing=false,speed=1,angle='three',skeleton=true,trajectory=false,lastFrame=0,toastTimer,jobTick=0;
let modalReturn=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{}}
function task(){return state.tasks.find(t=>t.id===state.selected)||state.tasks[0];}
function role(id){return state.roles.find(r=>r.id===id);}
function activeVersion(t=task()){return (t.versions||[]).find(v=>v.id===t.current);}
function currCandidate(t=task()){return t.candidates.find(c=>c.id===t.chosen);}
function badge(t){const m={draft:['待生成',''],candidates:['待选候选','blue'],review:['待验收','warn'],accepted:['已采用','good'],exported:['已导出','good']};const j=state.jobs.find(j=>j.task===t.id&&['queued','running'].includes(j.status));if(j)return `<span class="pill blue">${j.status==='running'?'处理中':'已排队'}</span>`;const a=m[t.status]||m.draft;return `<span class="pill ${a[1]}">${a[0]}</span>`;}
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.className='toast'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),4200);}
function selectTask(id){state.selected=id;const t=task();const v=activeVersion(t);state.draft={...(v?v.params:defaults)};state.compare=t.versions[0]?.id||'';state.tab=t.versions.length?'fit':'candidates';frame=0;playing=false;state.page='studio';persist();render();}
function render(){const app=$('#app');$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(state.page==='studio'){app.innerHTML=sidebar()+studio()+inspector();}else if(state.page==='roles'){app.innerHTML=rolesPage();}else if(state.page==='queue'){app.innerHTML=queuePage();}else{app.innerHTML=deliveryPage();}updateGlobal();drawAll();}
function sidebar(){const tasks=state.tasks.filter(t=>(state.roleFilter==='all'||t.role===state.roleFilter)&&(state.filter==='all'||state.filter==='review'&&['review','candidates'].includes(t.status)||state.filter==='accepted'&&!!t.accepted));return `<aside class="sidebar"><div class="sidebar-head"><h2>动作任务</h2><span class="small muted">${state.tasks.length} 个动作，按角色管理</span></div><label class="role-select-label" for="role-filter">角色</label><select id="role-filter"><option value="all">全部角色</option>${state.roles.map(r=>`<option value="${esc(r.id)}" ${state.roleFilter===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select><div class="filterbar" aria-label="动作状态">${[['all','全部'],['review','待处理'],['accepted','已采用']].map(([v,n])=>`<button class="filter ${state.filter===v?'active':''}" data-filter="${v}">${n}</button>`).join('')}</div><div class="action-list">${tasks.map(t=>`<div class="action-item ${state.selected===t.id?'active':''}"><input type="checkbox" aria-label="批量选择 ${esc(t.name)}" data-task-check="${esc(t.id)}" ${state.selection.includes(t.id)?'checked':''}><button class="action-pick" data-task="${esc(t.id)}"><span class="action-name">${esc(t.name)}</span><span class="action-meta"><span>${esc(role(t.role).name)} · ${t.duration}s</span>${badge(t)}</span></button></div>`).join('')||'<p class="small muted">当前筛选下没有动作</p>'}</div><div class="bulkbar"><div class="row between"><span class="small muted">已选 ${state.selection.length} 项</span><button class="btn ghost tiny" data-cmd="select-visible">全选当前列表</button></div><button class="btn full" data-cmd="bulk-generate">为所选生成候选</button><button class="btn ghost full" data-cmd="bulk-export">导出已采用动作</button></div><div class="role-mini"><strong>角色只需准备一次</strong><p>骨架和相机固定后，同一识别器可处理该角色的多个动作。</p><button class="btn ghost tiny" data-page="roles">查看角色与识别器 →</button></div></aside>`;}
function studio(){const t=task(),r=role(t.role),v=activeVersion(t);let content='';if(state.tab==='candidates')content=candidatesPanel(t);else if(!v)content=`<div class="empty">还没有拟合版本<p class="small">先选择可用视频候选，再开始拟合。</p><button class="btn" data-tab="candidates">查看视频候选</button></div>`;else content=viewer(t,state.tab==='compare')+versionsPanel(t);return `<main class="main"><div class="eyebrow">ANIMATION / ${esc(t.slug)}</div><div class="title-line"><div><h1>${esc(t.name)}</h1><p>${esc(r.name)} <span class="muted">/</span> ${esc(r.rig)} <span class="muted">/</span> ${t.duration} 秒</p></div><button class="btn ${t.accepted?'primary':''}" data-cmd="export" ${!t.accepted?'disabled':''}>导出动作 ↗</button></div><div class="stages"><span class="stage ${r.reader==='ready'?'done':''}">① 角色${r.reader==='ready'?'就绪':'待训练'}</span><span>›</span><span class="stage ${t.candidates.length?'done':'current'}">② 视频候选</span><span>›</span><span class="stage ${v?'current':''}">③ 拟合与验收</span><span>›</span><span class="stage ${t.accepted?'done':''}">④ 采用并导出</span></div><div class="tabs" role="tablist" aria-label="动作制作阶段">${[['candidates',`视频候选 · ${t.candidates.length}`],['fit','拟合调试'],['compare','版本比较']].map(([id,n])=>`<button role="tab" aria-selected="${state.tab===id}" class="tab ${state.tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('')}</div>${content}</main>`;}
function viewer(t,compare){const v=activeVersion(t);const cv=t.versions.find(x=>x.id===state.compare)||t.versions[0];return `${compare?`<div class="compare-key"><span>同一时间轴 · 对比脚底、手部与动作幅度</span><label>左侧基准 <select id="compare-version">${t.versions.map(x=>`<option value="${x.id}" ${cv.id===x.id?'selected':''}>${x.id} · ${esc(x.desc)}</option>`).join('')}</select></label></div>`:''}<div class="viewer-toolbar"><select id="view-angle" aria-label="预览视角"><option value="three" ${angle==='three'?'selected':''}>三分之四视角</option><option value="front" ${angle==='front'?'selected':''}>正面</option><option value="side" ${angle==='side'?'selected':''}>侧面</option></select><div class="view-tools"><label><input id="skeleton" type="checkbox" ${skeleton?'checked':''}> 骨架</label><label><input id="trajectory" type="checkbox" ${trajectory?'checked':''}> 根运动轨迹</label></div></div><div class="viewer"><div class="canvas-grid"><div class="viewport"><canvas data-scene="${compare?'baseline':'reference'}" aria-label="${compare?'基准动作':'输入视频的程序化动作示意'}"></canvas><div class="viewport-label"><span class="viewport-tag">${compare?'基准版本':'输入视频示意'}</span><strong>${compare?cv.id:esc(t.chosen||'C02')}</strong></div><div class="viewport-foot">${compare?esc(cv.desc):'参考动作 · 双视角输入'}</div></div><div class="viewport"><canvas data-scene="fit" aria-label="当前拟合版本的程序化三维示意"></canvas><div class="viewport-label"><span class="viewport-tag fit">拟合版本</span><strong>${v.id}</strong>${t.accepted===v.id?'<span class="pill good">已采用</span>':''}</div><div class="viewport-foot">${esc(v.desc)}</div></div></div><span class="viewer-note">程序化示意 · 非真实视频 / 推理结果</span><div class="playbar"><button class="btn" data-cmd="play" id="play-button" aria-label="${playing?'暂停':'播放'}">${playing?'Ⅱ 暂停':'▶ 播放'}</button><button class="btn ghost" data-cmd="prev" aria-label="上一帧">‹</button><button class="btn ghost" data-cmd="next" aria-label="下一帧">›</button><span class="time mono" id="time-label">${timeLabel(t)}</span><select id="speed" aria-label="播放速度"><option value="0.5" ${speed===.5?'selected':''}>0.5×</option><option value="1" ${speed===1?'selected':''}>1×</option><option value="2" ${speed===2?'selected':''}>2×</option></select><span class="muted small">24 fps</span></div><div class="timeline"><div class="timeline-head"><span>时间轴 <span class="mono" id="frame-label">F${Math.round(frame).toString().padStart(3,'0')}</span></span><span>${v.params.foot?'脚锁定已启用':'接触帧需留意脚滑'}</span></div><div class="timeline-track"><div class="timeline-warning"></div><input id="scrubber" type="range" min="0" max="${t.duration*24-1}" value="${Math.round(frame)}" step="1" aria-label="动作时间轴"></div><div class="ticks"><span>0s</span><span>${(t.duration/4).toFixed(2)}s</span><span>${(t.duration/2).toFixed(2)}s</span><span>${(t.duration*3/4).toFixed(2)}s</span><span>${t.duration}s</span></div></div></div><div class="issue-row"><span class="muted">检查点</span><button data-cmd="jump">F068–080 · 留意手部穿身</button><span class="muted">空格播放 · ← → 逐帧</span></div>`;}
function timeLabel(t){return `${(frame/24).toFixed(2)} / ${t.duration.toFixed(2)} s`;}
function versionsPanel(t){return `<div class="section-head"><h3>拟合版本 <span class="muted small">· ${t.versions.length}</span></h3><span class="small muted">切换查看，不覆盖已采用版本</span></div><div class="version-list">${t.versions.slice(-3).map(v=>`<button class="version ${v.id===t.current?'selected':''}" data-version="${v.id}"><div class="version-title"><span class="mono">${v.id}</span>${v.id===t.accepted?'<span class="pill good">已采用</span>':v.id===t.current?'<span class="pill blue">当前查看</span>':''}</div><p>${esc(v.desc)}</p><p>${esc(v.candidate)} · 平滑 ${v.params.smooth} Hz · 脚锁定${v.params.foot?'开':'关'}</p></button>`).join('')}</div><p class="hint">每次重算生成独立版本。只有点“采用当前版本”才会进入正式导出。</p>`;}
function candidatesPanel(t){const r=role(t.role);return `<div class="section-head"><h3>挑选动作参考</h3><div class="row"><button class="btn ghost tiny" data-cmd="brief">编辑动作说明</button><button class="btn tiny" data-cmd="generate">＋ 再生成一组</button></div></div><p class="hint" style="margin:0 0 15px">先看动作是否符合要求，再看双视角一致性。这里的检查值与动作均为演示。</p>${!t.candidates.length?`<div class="empty">还没有视频候选<p>${r.reader==='ready'?'可以先生成候选，也可导入已有视频。':'可先生成视频；拟合前需要完成角色识别器训练。'}</p><button class="btn primary" data-cmd="generate">生成第一组候选</button><button class="btn" data-cmd="import-video">导入视频</button></div>`:`<div class="candidate-grid">${t.candidates.map((c,i)=>`<article class="candidate ${t.chosen===c.id?'selected':''}"><canvas data-scene="candidate" data-candidate="${i}" aria-label="${c.id} 动作示意"></canvas><div class="candidate-body"><div class="row between"><h3>${c.id} ${t.chosen===c.id?'· 已选参考':''}</h3><span class="pill ${c.quality==='good'?'good':c.quality==='warn'?'warn':'bad'}">${c.quality==='good'?'可拟合':c.quality==='warn'?'需留意':'不建议使用'}</span></div><p>Seed ${c.seed} · ${t.duration}s / 24 fps</p><p>${esc(c.note)}</p><button class="btn ${t.chosen===c.id?'primary':''}" data-candidate-pick="${c.id}">${t.chosen===c.id?'✓ 当前参考':'选择此候选'}</button></div></article>`).join('')}</div><div class="row between" style="margin-top:15px"><button class="btn ghost tiny" data-cmd="import-video">导入自己的视频</button><button class="btn primary" data-cmd="fit-candidate" ${currCandidate(t)?.quality==='fail'||r.reader!=='ready'?'disabled':''}>用 ${esc(t.chosen||'所选候选')} 创建拟合版本 →</button></div>`}${r.reader!=='ready'?'<div class="notice warn">该角色的识别器尚未就绪。到角色库完成训练后，再进行拟合。</div>':''}`;}
function inspector(){const t=task(),v=activeVersion(t),d=state.draft,changed=v&&JSON.stringify(v.params)!==JSON.stringify(d);return `<aside class="inspector"><div><h2>拟合参数</h2><p>${v?`当前查看 ${v.id} · ${esc(v.candidate)}`:'为首个拟合版本设置参数'}</p><div class="field"><label for="preset">动作预设</label><select id="preset"><option value="custom">自定义 / 当前版本</option><option value="attack">快速攻击 · 保留爆发</option><option value="idle">静态待机 · 优先稳定</option><option value="walk">行走奔跑 · 接触与位移</option></select></div><div class="field"><div class="row"><label for="smooth">平滑截止频率</label><span class="mono" id="smooth-value">${d.smooth} Hz</span></div><input type="range" id="smooth" min="2" max="10" step="0.5" value="${d.smooth}"><small>数值越低越平滑；过低会削弱快速挥砍。</small></div><label class="toggle">脚部接触锁定<input id="foot" type="checkbox" ${d.foot?'checked':''}></label><label class="toggle">按步幅生成根位移<input id="steps" type="checkbox" ${d.steps?'checked':''}></label><label class="toggle">尾巴 / 耳部弹性<input id="springs" type="checkbox" ${d.springs?'checked':''}></label><label class="toggle">肢体防穿身<input id="collision" type="checkbox" ${d.collision?'checked':''}></label><div class="param-note" id="param-status">${changed?'参数已修改，预览仍为当前版本；重算后生效。':'参数与当前版本一致。'}</div><button class="btn full recompute" data-cmd="recompute" ${!currCandidate(t)||currCandidate(t).quality==='fail'||role(t.role).reader!=='ready'?'disabled':''}>重新拟合为新版本</button><div class="lineage">复用角色识别器和关节读取结果<br>仅重算拟合、修整与预览</div></div><div><div class="inspector-block"><h3>当前版本检查</h3>${v?`<div class="row between small"><span class="muted">脚部接触</span><span class="pill ${v.params.foot?'good':'warn'}">${v.params.foot?'已锁定':'需检查脚滑'}</span></div><div class="row between small" style="margin-top:9px"><span class="muted">动作连续性</span><span class="pill ${v.params.smooth<=6?'good':'warn'}">${v.params.smooth<=6?'平滑处理':'保留快速变化'}</span></div><p style="margin-top:12px">以上为示意状态，采用前请播放并检查不同视角。</p>`:'<p>生成拟合版本后查看检查结果。</p>'}</div><div class="adoptbox"><strong class="small">${t.accepted?`正式采用：${t.accepted}`:'尚未选定正式版本'}</strong><p>${t.accepted?'可以继续试新参数，正式版本保持不变。':'确认动作幅度、脚底接触和三维姿态，再选为正式版本。'}</p><button class="btn primary full" data-cmd="adopt" ${!v||v.id===t.accepted?'disabled':''}>${v&&v.id===t.accepted?'✓ 当前版本已采用':'采用当前版本'}</button></div><div class="inspector-block"><h3>本动作记录</h3><div class="log-entry">${esc(t.candidates.length?`${t.candidates.length} 个视频候选，当前参考 ${t.chosen}`:'等待生成或导入视频')}</div><div class="log-entry">${t.versions.length} 个拟合版本${t.accepted?`，已采用 ${t.accepted}`:''}</div><div class="log-entry">角色与相机版本固定；新视频独立保存。</div></div></div></aside>`;}
function rolesPage(){return `<section class="content-page"><div class="page-head"><div><div class="eyebrow">CHARACTER LIBRARY</div><h1>角色与识别器</h1><p>先确认模型、骨架和相机。准备完成后，同一角色可以批量制作多个动作。</p></div><button class="btn primary" data-cmd="new-role">＋ 添加角色</button></div><div class="role-grid">${state.roles.map(r=>`<article class="role-card"><canvas data-scene="role" data-role="${esc(r.id)}" aria-label="${esc(r.name)} 角色示意"></canvas><div class="role-info"><div class="row between"><h2>${esc(r.name)}</h2><span class="pill ${r.reader==='ready'?'good':'warn'}">${r.reader==='ready'?'识别器就绪':'待训练'}</span></div><dl><dt>模型文件</dt><dd>${esc(r.file)}</dd><dt>骨架版本</dt><dd>${esc(r.rig)}</dd><dt>相机布局</dt><dd>${esc(r.cameras)}</dd><dt>识别器</dt><dd>${r.reader==='ready'?`reader v${String(r.readerVersion||1).padStart(2,'0')} · 演示就绪`:'尚未训练 · 模拟训练约 10 秒'}</dd></dl><div class="row"><button class="btn" data-train="${esc(r.id)}">${r.reader==='ready'?'重新训练（新版本）':'训练识别器'}</button><button class="btn ghost" data-role-work="${esc(r.id)}">查看角色动作 →</button></div></div></article>`).join('')}</div><div class="sidenote">角色示意不代表实际模型。正式工具会显示真实模型、骨架检查与起始双视角；更换模型、骨架或相机时生成新的角色版本。</div></section>`;}
const jobNames={generate:'生成视频候选',fit:'拟合动作与预览',train:'训练角色识别器',export:'导出已采用动作'};
function queuePage(){return `<section class="content-page"><div class="page-head"><div><div class="eyebrow">PRODUCTION QUEUE</div><h1>运行队列</h1><p>排队、取消与重试都保留已经完成的结果。所有进度为本地计时模拟。</p></div><button class="btn" data-cmd="pause">${state.paused?'▶ 继续队列':'Ⅱ 暂停队列'}</button></div><div class="queue-summary"><div><strong>${state.jobs.filter(j=>j.status==='running').length} 个运行中 · ${state.jobs.filter(j=>j.status==='queued').length} 个等待中</strong><p>${state.paused?'队列已暂停，当前模拟任务停止推进。':'演示按顺序处理，避免多个任务争用显卡。'}</p></div><span class="pill blue">单机 · 顺序调度</span></div>${state.jobs.length?`<div class="table-wrap"><table><thead><tr><th>任务 / 对象</th><th>阶段</th><th>进度</th><th>状态</th><th>操作</th></tr></thead><tbody>${[...state.jobs].reverse().map(j=>`<tr><td><strong>${esc(j.label)}</strong><div class="small muted mono">${j.id}</div></td><td>${jobNames[j.type]}</td><td class="queue-progress"><span class="small">${Math.round(j.progress)}% · ${esc(jobStage(j))}</span><div class="progress"><div style="width:${j.progress}%"></div></div></td><td><span class="pill ${j.status==='done'?'good':j.status==='canceled'?'warn':'blue'}">${({queued:'等待中',running:state.paused?'已暂停':'运行中',done:'已完成',canceled:'已取消'})[j.status]}</span></td><td>${['running','queued'].includes(j.status)?`<button class="btn tiny danger" data-cancel="${j.id}">取消</button>`:`<button class="btn ghost tiny" data-job-detail="${j.id}">查看记录</button>${j.status==='canceled'?` <button class="btn tiny" data-retry="${j.id}">重试</button>`:''}`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">没有运行任务<p class="small">从工作台生成候选，或调整参数后提交新拟合。</p><button class="btn" data-page="studio">返回动作工作台</button></div>'}</section>`;}
function jobStage(j){if(j.status==='canceled')return '保留已有产物';if(j.status==='done')return '完成';if(j.status==='queued')return '等待资源';const stages={generate:['加载工作流','生成动作视频','检查与保存候选'],fit:['复用关节读取','求解与修整','生成对比预览'],train:['生成姿势与渲染','训练关节识别器','评估并保存'],export:['准备已采用版本','整理动作导出','生成交付记录']};return stages[j.type][Math.min(2,Math.floor(j.progress/34))];}
function deliveryPage(){return `<section class="content-page"><div class="page-head"><div><div class="eyebrow">DELIVERY LIBRARY</div><h1>交付库</h1><p>只导出明确采用的版本；新拟合不会自动替换正式动作。</p></div><button class="btn" data-cmd="bulk-export">＋ 导出已采用动作</button></div><div class="notice warn">这是交互演示：不生成真实 FBX / GLB。可下载 JSON 清单，查看正式工具将保存的动作、版本与导出设置。</div>${state.deliveries.length?state.deliveries.map(d=>`<article class="export-card"><div><h3>${esc(d.label)} <span class="pill good">模拟导出完成</span></h3><p>${d.entries.length} 个动作 · ${esc(d.settings.format)} · ${d.settings.fps} fps · ${d.settings.root==='inplace'?'原地动作':'保留根位移'}${d.settings.loop?' · 循环处理':''}</p><div class="row">${d.entries.map(e=>`<span class="pill">${esc(e.name)} / ${esc(e.version)}</span>`).join('')}</div><p style="margin-top:8px">${esc(d.time)}</p></div><button class="btn" data-download="${d.id}">下载演示清单 ↓</button></article>`).join(''):'<div class="empty">还没有交付记录<p class="small">采用一个拟合版本，再设置导出参数。</p><button class="btn" data-cmd="export-walk">试用“持剑行走”的导出</button></div>'}</section>`;}
function updateGlobal(){const pending=state.jobs.filter(j=>['queued','running'].includes(j.status));$('#queue-count').textContent=pending.length;$('#delivery-count').textContent=state.deliveries.length;const running=pending.find(j=>j.status==='running');$('#global-progress').style.width=running?`${running.progress}%`:'0';$('#queue-status').textContent=running?`${state.paused?'已暂停':'模拟运行'} · ${running.label} / ${jobNames[running.type]} · ${Math.round(running.progress)}%`:pending.length?`${pending.length} 个演示任务等待中`:'演示队列待机 · 未连接 ComfyUI / Blender';$('#footer-context').textContent=state.page==='studio'?`当前角色：${role(task().role).name} · ${task().accepted?'已采用 '+task().accepted:'尚未采用版本'}`:'本机浏览器保存演示数据 · 不修改实际工程';}
function openModal(html,wide=false){playing=false;modalReturn=document.activeElement;$('#modal-host').innerHTML=`<div class="modal-backdrop"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal ${wide?'wide':''}">${html}</section></div>`;const first=$('input,textarea,select,button',$('#modal-host'));first?.focus();}
function closeModal(){$('#modal-host').innerHTML='';if(modalReturn?.isConnected)modalReturn.focus();}
function modalHead(title){return `<div class="row between"><h2 id="modal-title">${title}</h2><button class="close" data-cmd="close" aria-label="关闭对话框">×</button></div>`;}
function batchModal(){openModal(`${modalHead('批量创建动作')}<p class="modal-intro">为一个角色创建多条动作，分别保存视频候选与拟合版本。</p><form id="batch-form"><div class="field"><label for="batch-role">目标角色</label><select id="batch-role">${state.roles.map(r=>`<option value="${esc(r.id)}" ${(state.roleFilter==='all'?task().role:state.roleFilter)===r.id?'selected':''}>${esc(r.name)}${r.reader==='ready'?' · 识别器就绪':' · 拟合前需训练'}</option>`).join('')}</select></div><div class="field"><label for="action-lines">动作名称 · 每行一个</label><textarea id="action-lines" required placeholder="举盾防御&#10;向前突刺&#10;左侧闪避">举盾防御
向前突刺
左侧闪避</textarea></div><div class="row"><label>每条动作时长<select id="batch-duration"><option value="4">4 秒</option><option value="5" selected>5 秒</option><option value="8">8 秒</option></select></label><label>每条候选数量<select id="batch-count"><option value="1">1 个</option><option value="3" selected>3 个</option><option value="5">5 个</option></select></label></div><label class="toggle">创建后立即生成候选<input id="batch-run" type="checkbox" checked></label><div class="notice">每条动作独立排队，生成后等待你挑选候选。识别器不会按动作重复训练。</div><div class="error-text" id="form-error" role="alert"></div><div class="modal-actions"><button class="btn" type="button" data-cmd="close">取消</button><button class="btn primary" type="submit">创建动作任务</button></div></form>`);}
function exportModal(ids){const ts=state.tasks.filter(t=>ids.includes(t.id)&&t.accepted);if(!ts.length){toast('请先采用一个拟合版本，或选择已有正式版本的动作。',true);return;}openModal(`${modalHead('导出已采用动作')}<p class="modal-intro">导出固定采用版本，不使用尚在调试的新版本。</p><div class="notice">${ts.map(t=>`${esc(t.name)} · ${esc(t.accepted)}`).join('<br>')}</div><form id="export-form" data-ids="${esc(ts.map(t=>t.id).join(','))}"><div class="row"><label>输出格式<select id="export-format"><option value="FBX">FBX · 动作文件</option><option value="GLB">GLB · 模型与动作预览</option><option value="BLEND">BLEND · 可编辑工程</option></select></label><label>采样帧率<select id="export-fps"><option value="30">30 fps</option><option value="24">24 fps</option><option value="60">60 fps</option></select></label></div><div class="field" style="margin-top:16px"><label for="export-root">根运动</label><select id="export-root"><option value="inplace">原地动作 · 位移由游戏控制</option><option value="root">保留根位移 · Root Motion</option></select></div><label class="toggle">循环动作接缝处理<input id="export-loop" type="checkbox" ${ts.every(t=>t.kind==='walk')?'checked':''}></label><div class="notice warn">演示只创建交付记录与 JSON 清单，不调用 Blender，不生成真实动画文件。正式工具还需验证导出和游戏消费规则。</div><div class="modal-actions"><button type="button" class="btn" data-cmd="close">取消</button><button class="btn primary" type="submit">确认导出（模拟）</button></div></form>`);}
function generate(t,count=3){enqueue('generate',{task:t.id,label:t.name,payload:{count,brief:t.brief||defaultBrief(t)}});}
function enqueue(type,data){if(state.jobs.some(j=>j.type===type&&(data.task?j.task===data.task:j.role===data.role)&&['queued','running'].includes(j.status))){toast('同一对象已有此类任务，请等待完成或取消。',true);return false;}state.jobs.push({id:`JOB-${String(state.next++).padStart(3,'0')}`,type,...data,status:'queued',progress:0});persist();render();return true;}
function fitTask(t,params){if(!currCandidate(t)){toast('请先选择视频候选。',true);return;}if(currCandidate(t).quality==='fail'){toast('当前候选双视角检查不通过，请更换候选。',true);return;}if(role(t.role).reader!=='ready'){toast('请先到角色库训练该角色的识别器。',true);return;}if(enqueue('fit',{task:t.id,label:t.name,payload:{params:{...params},candidate:t.chosen}}))toast('拟合任务已入队。完成后产生新版本，已采用版本不变。');}
function finishJob(j){j.status='done';j.progress=100;const t=state.tasks.find(t=>t.id===j.task);if(j.type==='generate'&&t){for(let i=0;i<j.payload.count;i++){const n=t.candidates.length+1;t.candidates.push(candidate('C'+String(n).padStart(2,'0'),i===1?'warn':'good',61200+state.next*10+i));}if(!t.chosen)t.chosen=t.candidates[0].id;if(!t.versions.length)t.status='candidates';}else if(j.type==='fit'&&t){const id='v'+String(t.versions.length+1).padStart(2,'0');const p=j.payload.params;t.versions.push(version(id,p,`平滑 ${p.smooth} Hz · ${p.foot?'脚锁定':'自由接触'}`,j.payload.candidate));t.current=id;if(!t.accepted)t.status='review';if(state.selected===t.id){state.draft={...p};state.tab='fit';}}else if(j.type==='train'){const trained=role(j.role);trained.readerVersion=(trained.readerVersion||(trained.reader==='ready'?1:0))+1;trained.reader='ready';}else if(j.type==='export'){const entries=j.payload.entries;state.deliveries.unshift({id:j.id,label:entries.length>1?`批量交付 · ${entries.length} 个动作`:entries[0].name,entries,settings:j.payload.settings,time:new Date().toLocaleString('zh-CN'),demo:true});entries.forEach(e=>{const target=state.tasks.find(x=>x.id===e.task);if(target&&target.accepted===e.version)target.status='exported';});}persist();render();toast(`${j.label}：${jobNames[j.type]}完成（模拟）`);}
setInterval(()=>{if(state.paused)return;let j=state.jobs.find(x=>x.status==='running');if(!j){j=state.jobs.find(x=>x.status==='queued');if(j){j.status='running';persist();render();}return;}j.progress=Math.min(100,j.progress+(j.type==='train'?3.5:j.type==='generate'?5:8));if(j.progress>=100){finishJob(j);return;}jobTick++;if(jobTick%4===0)persist();if(state.page==='queue')render();else updateGlobal();},350);
function download(d){const payload={demo:true,notice:'交互原型模拟清单，不包含真实动画文件',delivery:d.id,settings:d.settings,actions:d.entries,time:d.time};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`MotionFoundry_${d.id}_DEMO.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已下载演示清单；没有生成真实动画文件。');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const {page,task:tid,tab,filter,version:vid,candidatePick,train,roleWork,cancel,retry,jobDetail,download:did,cmd}=b.dataset;if(page){state.page=page;persist();render();return;}if(tid){selectTask(tid);return;}if(tab){state.tab=tab;persist();render();return;}if(filter){state.filter=filter;persist();render();return;}if(vid){const t=task(),v=t.versions.find(x=>x.id===vid);t.current=vid;state.draft={...v.params};persist();render();return;}if(candidatePick){task().chosen=candidatePick;persist();render();return;}if(train){const r=role(train);if(enqueue('train',{role:r.id,label:r.name,payload:{}}))toast('模拟训练已入队；已有识别器保留到新训练完成。');return;}if(roleWork){state.roleFilter=roleWork;state.filter='all';const t=state.tasks.find(x=>x.role===roleWork);if(t)selectTask(t.id);else{batchModal();}return;}if(cancel){const j=state.jobs.find(x=>x.id===cancel);j.status='canceled';persist();render();toast('任务已取消，已有版本和已完成结果保留。');return;}if(retry){const j=state.jobs.find(x=>x.id===retry);enqueue(j.type,{task:j.task,role:j.role,label:j.label,payload:JSON.parse(JSON.stringify(j.payload))});return;}if(jobDetail){const j=state.jobs.find(x=>x.id===jobDetail);openModal(`${modalHead('任务记录')}<p class="modal-intro">${esc(j.label)} · ${jobNames[j.type]}</p><div class="logs">${esc(JSON.stringify(j,null,2))}</div><div class="modal-actions"><button class="btn" data-cmd="close">关闭</button></div>`);return;}if(did){download(state.deliveries.find(x=>x.id===did));return;}if(!cmd)return;const t=task();if(cmd==='batch')batchModal();if(cmd==='close')closeModal();if(cmd==='generate'){generate(t);toast('已提交模拟生成任务，可在运行队列查看。');}if(cmd==='recompute'||cmd==='fit-candidate')fitTask(t,state.draft);if(cmd==='adopt'){const v=activeVersion(t);if(v){t.accepted=v.id;t.status='accepted';persist();render();toast(`已采用 ${v.id}，可导出；之后重算不会覆盖它。`);}}if(cmd==='export')exportModal([t.id]);if(cmd==='export-walk')exportModal(['walk']);if(cmd==='bulk-export')exportModal(state.selection.length?state.selection:state.tasks.filter(x=>x.accepted).map(x=>x.id));if(cmd==='play'){playing=!playing;$('#play-button').textContent=playing?'Ⅱ 暂停':'▶ 播放';$('#play-button').setAttribute('aria-label',playing?'暂停':'播放');}if(cmd==='prev'||cmd==='next'){playing=false;frame=Math.max(0,Math.min(t.duration*24-1,frame+(cmd==='prev'?-1:1)));updatePlayback();}if(cmd==='jump'){frame=68;playing=false;updatePlayback();toast('已定位到 F068；逐帧查看手部与身体的距离。');}if(cmd==='pause'){state.paused=!state.paused;persist();render();}if(cmd==='select-visible'){const ids=$$('[data-task-check]').map(x=>x.dataset.taskCheck);state.selection=ids.every(id=>state.selection.includes(id))?state.selection.filter(x=>!ids.includes(x)):[...new Set([...state.selection,...ids])];persist();render();}if(cmd==='bulk-generate'){if(!state.selection.length)toast('先勾选左侧需要处理的动作。',true);else{state.tasks.filter(x=>state.selection.includes(x.id)).forEach(x=>generate(x));toast('已为所选动作提交候选生成任务。');}}if(cmd==='brief')briefModal();if(cmd==='new-role')newRoleModal();if(cmd==='import-video')importModal();if(cmd==='guide')guideModal();if(cmd==='start-guide'){closeModal();selectTask('slash');state.tab='candidates';render();}if(cmd==='reset')openModal(`${modalHead('重置演示')}<p class="modal-intro">清除本页面保存的模拟任务、版本和交付记录，恢复初始案例。不会操作任何工程文件。</p><div class="modal-actions"><button class="btn" data-cmd="close">保留当前状态</button><button class="btn primary" data-cmd="confirm-reset">重置模拟数据</button></div>`);if(cmd==='confirm-reset'){state=fresh();frame=36;playing=false;persist();closeModal();render();toast('演示已恢复初始状态。');}});
function parameterChange(){const t=task(),v=activeVersion(t);const changed=!v||JSON.stringify(v.params)!==JSON.stringify(state.draft);$('#param-status').textContent=changed?'参数已修改，预览仍为当前版本；重算后生效。':'参数与当前版本一致。';persist();}
document.addEventListener('input',e=>{const el=e.target;if(el.id==='smooth'){state.draft.smooth=Number(el.value);$('#smooth-value').textContent=`${el.value} Hz`;parameterChange();}if(el.id==='scrubber'){frame=Number(el.value);playing=false;updatePlayback();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.taskCheck){state.selection=el.checked?[...new Set([...state.selection,el.dataset.taskCheck])]:state.selection.filter(x=>x!==el.dataset.taskCheck);persist();render();}if(el.id==='role-filter'){state.roleFilter=el.value;persist();render();}if(['foot','steps','springs','collision'].includes(el.id)){state.draft[el.id]=el.checked;parameterChange();}if(el.id==='view-angle'){angle=el.value;drawAll();}if(el.id==='skeleton'){skeleton=el.checked;drawAll();}if(el.id==='trajectory'){trajectory=el.checked;drawAll();}if(el.id==='speed')speed=Number(el.value);if(el.id==='compare-version'){state.compare=el.value;persist();render();}if(el.id==='preset'){const ps={attack:{...defaults,smooth:6,foot:true},idle:{...defaults,smooth:3,foot:true},walk:{...defaults,smooth:4,foot:true,steps:true}};if(ps[el.value]){state.draft=ps[el.value];persist();render();toast('预设已填入；提交重算后生成新版本。');}}});
document.addEventListener('submit',e=>{if(e.target.id==='batch-form'){e.preventDefault();const names=$('#action-lines').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!names.length||names.length>30){$('#form-error').textContent='请输入 1–30 个动作名称。';return;}if(names.some(n=>n.length>40)){$('#form-error').textContent='每个动作名称最多 40 个字符。';return;}const roleId=$('#batch-role').value,duration=Number($('#batch-duration').value),count=Number($('#batch-count').value),run=$('#batch-run').checked;const added=names.map((name,i)=>({id:`action-${Date.now()}-${i}`,role:roleId,name,slug:`action_${state.tasks.length+i+1}`,kind:'attack',duration,status:'draft',candidates:[],chosen:null,versions:[],current:null,accepted:null}));state.tasks.push(...added);state.roleFilter=roleId;state.filter='all';state.selection=added.map(t=>t.id);closeModal();selectTask(added[0].id);if(run)added.forEach(t=>generate(t,count));persist();render();toast(`已创建 ${added.length} 个动作${run?'，候选生成已排队':''}。`);}if(e.target.id==='export-form'){e.preventDefault();const ids=e.target.dataset.ids.split(',');const ts=state.tasks.filter(t=>ids.includes(t.id)&&t.accepted);const settings={format:$('#export-format').value,fps:Number($('#export-fps').value),root:$('#export-root').value,loop:$('#export-loop').checked};const entries=ts.map(t=>{const v=t.versions.find(x=>x.id===t.accepted);return{task:t.id,name:t.name,role:role(t.role).name,roleFile:role(t.role).file,version:t.accepted,candidate:v.candidate,duration:t.duration,parameters:{...v.params}};});closeModal();enqueue('export',{label:ts.length>1?`${ts.length} 个已采用动作`:ts[0].name,payload:{entries,settings}});state.page='queue';persist();render();toast('已按提交时的采用版本创建模拟导出任务。');}if(e.target.id==='role-form'){e.preventDefault();const name=$('#role-name').value.trim(),file=$('#role-file').files[0];if(!name||!file){$('#form-error').textContent='请输入角色名称并选择一个 .blend 文件。';return;}const r={id:`role-${Date.now()}`,name,file:file.name,rig:'待检查 · 演示建档',cameras:'正面 + 侧面 / 固定双视角',reader:'pending'};state.roles.push(r);closeModal();state.page='roles';persist();render();toast('角色已加入演示库；文件内容未上传或读取。');}if(e.target.id==='video-form'){e.preventDefault();const file=$('#video-file').files[0];if(!file){$('#form-error').textContent='请选择一个视频文件。';return;}const t=task(),id='C'+String(t.candidates.length+1).padStart(2,'0');t.candidates.push({id,quality:'warn',seed:'导入',note:`${file.name} · 演示未读取或检查视频内容`});t.chosen=id;if(!t.versions.length)t.status='candidates';closeModal();persist();render();toast('已登记视频文件名；正式工具需完成实际视频检查。');}});
function newRoleModal(){openModal(`${modalHead('添加角色')}<p class="modal-intro">正式工具将检查模型与骨架、渲染首帧，再训练识别器。此处只演示建档流程。</p><form id="role-form"><div class="field"><label for="role-name">角色名称</label><input id="role-name" required maxlength="40" placeholder="例如：荒原巨魔"></div><div class="field"><label for="role-file">已绑定骨架的 Blender 文件</label><input id="role-file" type="file" accept=".blend" required><small>本演示仅记录文件名，不读取模型，不上传文件。</small></div><div class="notice">无骨架模型先完成绑定和权重检查。自动绑定作为角色准备的独立步骤，不与日常动作批处理混在一起。</div><div id="form-error" class="error-text" role="alert"></div><div class="modal-actions"><button class="btn" type="button" data-cmd="close">取消</button><button class="btn primary" type="submit">添加到角色库</button></div></form>`);}
function importModal(){openModal(`${modalHead('导入动作视频')}<p class="modal-intro">视频应从当前角色的已知首帧生成，保持相机和双视角布局。</p><form id="video-form"><div class="field"><label for="video-file">视频文件</label><input id="video-file" type="file" accept="video/*" required><small>演示仅登记文件名，不读取、上传或分析视频内容。</small></div><div id="form-error" class="error-text" role="alert"></div><div class="modal-actions"><button class="btn" type="button" data-cmd="close">取消</button><button class="btn primary" type="submit">加入候选列表</button></div></form>`);}
function defaultBrief(t){return '角色完成“'+t.name+'”动作，保持原有体形与装备。动作起止清楚、重心可信，身体始终完整留在画面内。';}
function briefModal(){const t=task();openModal(modalHead('动作说明与生成要求')+'<p class="modal-intro">修改只影响下一次生成，已有视频与拟合版本保持不变。</p><form id="brief-form"><div class="field"><label for="motion-brief">动作描述</label><textarea id="motion-brief" required maxlength="1500">'+esc(t.brief||defaultBrief(t))+'</textarea></div><div class="notice">共用约束：使用当前角色渲染的首帧；固定相机；正面与侧面同步；无切镜、无特效、无运动模糊；保持全部肢体清晰可见。</div><p class="small muted">正式工具会把动作描述、共用约束和生成参数一并记录到每个候选，便于复现。</p><div class="modal-actions"><button class="btn" type="button" data-cmd="close">取消</button><button class="btn primary" type="submit">保存动作说明</button></div></form>');}
document.addEventListener('submit',e=>{if(e.target.id==='brief-form'){e.preventDefault();const brief=$('#motion-brief').value.trim();if(!brief)return;task().brief=brief;persist();closeModal();toast('动作说明已保存，下次生成使用新说明。');}});
function guideModal(){openModal(`${modalHead('从候选到成品，试一遍')}<p class="modal-intro">这是给制作者使用的工作台。数据、进度和动作预览均为本地模拟，所有按钮只操作演示状态。</p>${[['选视频候选','打开“视频候选”，选择 C02；不建议使用的候选会阻止提交拟合。'],['调试并生成新版本','播放、拖动时间轴、换视角；调整平滑或脚锁定后，点“重新拟合为新版本”。到运行队列可以暂停、取消或重试。'],['比较并采用','打开“版本比较”，同步比较基准和当前版本。满意后点“采用当前版本”，其他版本保留。'],['导出与批量制作','设置格式、帧率和根运动，模拟导出后到交付库下载清单。右上角可一次创建多个动作。']].map(([h,p],i)=>`<div class="guide-step"><span class="number">${i+1}</span><div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}<div class="modal-actions"><button class="btn" data-cmd="close">自己探索</button><button class="btn primary" data-cmd="start-guide">从重击案例开始 →</button></div>`);}
document.addEventListener('keydown',e=>{if($('#modal-host').children.length){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const fs=$$('button:not(:disabled),input,select,textarea,a[href]',$('#modal-host'));const first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.target.closest('input,textarea,select,button')||state.page!=='studio'||!$('#play-button'))return;if(e.code==='Space'){e.preventDefault();$('#play-button').click();}if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();frame=Math.max(0,Math.min(task().duration*24-1,frame+(e.code==='ArrowLeft'?-1:1)));playing=false;updatePlayback();}});
function updatePlayback(){const t=task();const scrub=$('#scrubber');if(scrub)scrub.value=Math.round(frame);const time=$('#time-label');if(time)time.textContent=timeLabel(t);const fl=$('#frame-label');if(fl)fl.textContent='F'+Math.round(frame).toString().padStart(3,'0');const pb=$('#play-button');if(pb){pb.textContent=playing?'Ⅱ 暂停':'▶ 播放';pb.setAttribute('aria-label',playing?'暂停':'播放');}drawAll();}
function drawAll(){$$('canvas[data-scene]').forEach(c=>drawScene(c));}
function drawScene(canvas){const rect=canvas.getBoundingClientRect();if(!rect.width)return;const ratio=Math.min(window.devicePixelRatio||1,2),w=rect.width,h=rect.height;if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);}const ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);const kind=canvas.dataset.scene;let t=task();if(kind==='role'){t=state.tasks.find(x=>x.role===canvas.dataset.role)||{role:canvas.dataset.role,kind:'attack',duration:5};}const v=activeVersion(t),base=t.versions?.find(x=>x.id===state.compare)||t.versions?.[0];const p=kind==='fit'?(v?.params||defaults):kind==='baseline'?(base?.params||defaults):{...defaults,smooth:8,foot:false};const isWolf=t.role==='wolf';const isCandidate=kind==='candidate';const idx=Number(canvas.dataset.candidate||0);const animFrame=kind==='role'?15:isCandidate?28+idx*15:frame;let q=animFrame/24;const phase=q*2.9+idx*.2;const yaw=angle==='front'?0:angle==='side'?Math.PI/2:.68;const scale=Math.min(w/(isWolf?3.8:2.9),h/(isWolf?3.1:3.05));const cx=w*.49,cy=h*.82;
const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#1b2430');bg.addColorStop(1,'#111922');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
function project(a){const x=a[0]*Math.cos(yaw)+a[2]*Math.sin(yaw),z=-a[0]*Math.sin(yaw)+a[2]*Math.cos(yaw);return[cx+x*scale,cy-a[1]*scale+z*scale*.3,z];}
function line(a,b,color,width=1){const pa=project(a),pb=project(b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(pa[0],pa[1]);ctx.lineTo(pb[0],pb[1]);ctx.stroke();}
for(let i=-5;i<=5;i++){line([i*.4,0,-2],[i*.4,0,2],i===0?'#45574f':'#2b3642',i===0?1.2:.6);line([-2,0,i*.4],[2,0,i*.4],i===0?'#514b44':'#2b3642',i===0?1.2:.6);}const shadow=project([0,0,0]);ctx.save();ctx.translate(shadow[0],shadow[1]);ctx.scale(1,.25);const grad=ctx.createRadialGradient(0,0,0,0,0,scale*.8);grad.addColorStop(0,'#0008');grad.addColorStop(1,'#0000');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,scale*.8,0,Math.PI*2);ctx.fill();ctx.restore();
const fit=kind==='fit'||kind==='baseline';const color=fit?'#8ccbb6':'#b5a48a';const joint=fit?'#b2f1d4':'#e7d1a3';let off=p.steps?(q/(t.duration||5)-.5)*.55:0;const walk=t.kind==='walk';const strike=Math.sin(phase);const bend=t.kind==='death'?Math.min(1,q/3)*.48:0;const jitter=fit&&p.smooth>6?Math.sin(q*35)*.035:0;const bob=walk?Math.abs(Math.sin(phase*2))*.06:.025*Math.sin(phase);const root=[off,1.02+bob,0];
function tube(a,b,width){const pa=project(a),pb=project(b);ctx.lineCap='round';ctx.strokeStyle='#0b1118';ctx.lineWidth=width*scale+3;ctx.beginPath();ctx.moveTo(pa[0],pa[1]);ctx.lineTo(pb[0],pb[1]);ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=width*scale;ctx.stroke();ctx.strokeStyle=fit?'#6b9e91':'#8a8070';ctx.lineWidth=Math.max(1,width*scale*.22);ctx.beginPath();ctx.moveTo(pa[0]-2,pa[1]);ctx.lineTo(pb[0]-2,pb[1]);ctx.stroke();}
let pts,edges;
if(!isWolf){const lean=t.kind==='attack'?.14*strike:t.kind==='reaction'?.13*Math.sin(phase):bend;const hipL=[off-.16,root[1],0],hipR=[off+.16,root[1],0];const chest=[off+lean,1.58+bob,0];const shoulderL=[chest[0]-.26,1.59+bob,0],shoulderR=[chest[0]+.26,1.59+bob,0];const head=[chest[0],1.99+bob,-.015];let kneeL=[off-.17,.54,walk?.18*Math.sin(phase):.09],kneeR=[off+.19,.54,walk?-.18*Math.sin(phase):-.06];const slide=fit&&!p.foot?.08*Math.sin(phase):0;const footL=[off-.22+slide,.07+(!p.foot&&walk?Math.max(0,Math.sin(phase))*.1:0),.12+(walk?.16*Math.sin(phase):0)],footR=[off+.23-slide,.07+(!p.foot&&walk?Math.max(0,-Math.sin(phase))*.1:0),.1-(walk?.16*Math.sin(phase):0)];let elbowL=[off-.43+lean,1.24+bob,.07],handL=[off-.34+lean,1.06+bob,.18];let elbowR=[off+.53+lean,1.31+bob,.15],handR=[off+.68+lean+jitter,1.13+bob,.38];if(t.kind==='attack'||t.kind==='reaction'){const a=strike*.65;elbowR=[off+.45+lean,1.46+a*.22,.15-a*.35];handR=[off+.62+lean+jitter,1.38+a*.65,.3-a*.5];handL=[off-.38+lean,1.25+a*.1,.18];}if(walk){handL[2]+=.2*Math.sin(phase);handR[2]-=.2*Math.sin(phase);}pts={root,hipL,hipR,chest,shoulderL,shoulderR,head,kneeL,kneeR,footL,footR,elbowL,elbowR,handL,handR};edges=[['hipL','kneeL',.19],['kneeL','footL',.145],['hipR','kneeR',.19],['kneeR','footR',.145],['root','chest',.43],['shoulderL','shoulderR',.27],['shoulderL','elbowL',.15],['elbowL','handL',.11],['shoulderR','elbowR',.17],['elbowR','handR',.12],['chest','head',.14]];edges.forEach(([a,b,width])=>tube(pts[a],pts[b],width));const hp=project(head);ctx.fillStyle=fit?'#9cadab':'#b8b0a1';ctx.beginPath();ctx.ellipse(hp[0],hp[1]-.05*scale,.125*scale,.155*scale,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#273341';ctx.fillRect(hp[0]-.1*scale,hp[1]-.055*scale,.2*scale,.035*scale);const tip=[handR[0]+.3,handR[1]+.72,handR[2]+.03];line(handR,tip,'#d6e0e4',Math.max(2,scale*.045));const cross=[handR[0]+.04,handR[1]+.1,handR[2]];line([cross[0]-.11,cross[1],cross[2]],[cross[0]+.13,cross[1],cross[2]],'#a99672',Math.max(2,scale*.038));line([footL[0],.055,footL[2]-.04],[footL[0],.055,footL[2]+.16],color,scale*.13);line([footR[0],.055,footR[2]-.04],[footR[0],.055,footR[2]+.16],color,scale*.13);
}else{const body=[off,.91,0],neck=[off+.67,1.04,0],head=[off+.91,1.16,0],tail=[off-.98,.8+Math.sin(phase)*.09,0];pts={root:body,chest:neck,head,tail,fl:[off+.5,.7,-.16],fr:[off+.5,.7,.16],bl:[off-.53,.65,-.17],br:[off-.53,.65,.17],flf:[off+.53,.06,-.16],frf:[off+.43,.06,.16],blf:[off-.63,.06,-.17],brf:[off-.5,.06,.17]};if(walk)for(const [i,k] of ['flf','frf','blf','brf'].entries()){pts[k][0]+=.18*Math.sin(phase+(i%2)*Math.PI);pts[k][1]+=.12*Math.max(0,Math.sin(phase+(i%2)*Math.PI));}edges=[['root','chest',.43],['chest','head',.25],['root','tail',.1],['fl','flf',.11],['fr','frf',.11],['bl','blf',.14],['br','brf',.14]];edges.forEach(([a,b,width])=>tube(pts[a],pts[b],width));const hp=project(head);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(hp[0],hp[1],scale*.2,scale*.15,-.4,0,Math.PI*2);ctx.fill();line([off+.9,1.24,0],[off+.82,1.47,0],color,scale*.07);}
if(skeleton&&kind!=='role'&&!isCandidate){edges.forEach(([a,b])=>line(pts[a],pts[b],joint,1));Object.values(pts).forEach(a=>{const pp=project(a);ctx.fillStyle=joint;ctx.beginPath();ctx.arc(pp[0],pp[1],2,0,Math.PI*2);ctx.fill();});}
if(trajectory&&kind!=='role'){ctx.setLineDash([4,4]);line([-.9,.02,0],[.9,.02,0],'#7da7d7',1.6);ctx.setLineDash([]);}
const origin=project([0,0,0]);ctx.strokeStyle='#8bccac';ctx.lineWidth=1;ctx.beginPath();ctx.arc(origin[0],origin[1],7,0,Math.PI*2);ctx.stroke();ctx.font='10px Segoe UI';ctx.fillStyle='#7e90a3';ctx.fillText('Z ↑',w-28,h-12);
}
function animate(now){if(playing&&state.page==='studio'&&$('#scrubber')){if(lastFrame){frame=(frame+Math.min(now-lastFrame,100)/1000*24*speed)%(task().duration*24);updatePlayback();}}lastFrame=now;requestAnimationFrame(animate);}
window.addEventListener('resize',drawAll);render();requestAnimationFrame(animate);
})();
